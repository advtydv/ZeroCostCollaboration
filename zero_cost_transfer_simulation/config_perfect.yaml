# Information Asymmetry Simulation Configuration - Perfect Agents
# This configuration runs agents in "perfect" mode with hard-coded optimal behavior

simulation:
  rounds: 20
  agents: 10
  show_full_revenue: true  # If true, agents see all revenue. If false, only their own revenue position.
  report_frequency: 0  # Request strategic reports every N rounds (0 to disable)
  
agents:
  # Agent mode configuration
  mode: "perfect"  # "llm" for LLM-based agents, "perfect" for hard-coded optimal behavior
  
  # Perfect agent configuration
  perfect_strategy:
    request_strategy: "all"  # Request from all holders of needed information
    response_delay: 0  # Respond to requests immediately (0 turns delay)
    submission_delay: 0  # Submit tasks immediately when ready
  
  # LLM configuration (not used in perfect mode, but kept for reference)
  model: "o3-mini-2025-01-31"
  uncooperative_count: 0  # Not applicable in perfect mode
  competitive_count: 0  # Not applicable in perfect mode
  
tasks:
  # Task configuration
  min_info_pieces: 4  # Minimum information pieces needed for a task
  max_info_pieces: 4  # Maximum information pieces needed for a task
  initial_tasks_per_agent: 2
  new_task_on_completion: true
  structured_packet_tasks: true
  owner_anchored_tasks: true
  distinct_external_holders: true
  task_service_window_rounds: 3
  access_grant_validity_rounds: 2
  
  # Task examples (can be expanded)
  task_templates:
    - "Assemble the assigned handoff packet using {info_pieces}"
    - "Prepare the delivery authorization using {info_pieces}"
    - "Finalize the execution bundle from {info_pieces}"
    - "Complete the field operations brief with {info_pieces}"
    - "Validate the dispatch package using {info_pieces}"
  
information:
  # Information distribution
  total_pieces: 100  # Total unique information pieces
  pieces_per_agent: 10 # How many pieces each agent starts with
  balanced_category_pool: true
  balanced_category_distribution: true
  
  # Distribution mode
  unique_distribution: false  # If true, each piece exists exactly once (no duplicates)
                              # If false, pieces can be held by multiple agents (1-3 copies)
  
  # Information examples
  info_templates:
    - "Shipment batch {n} manifest"
    - "Vendor {n} compliance memo"
    - "Unit {n} calibration record"
    - "Site {n} inventory snapshot"
    - "Route {n} handoff code"
  info_categories:
    - "manifest"
    - "compliance"
    - "calibration"
    - "inventory"
    - "handoff"
  
revenue:
  # Revenue (in dollars) for different actions
  task_completion: 10000  # $10,000 base revenue per task
  bonus_for_first: 0  # $2,000 bonus for completing a task first in a round
  incorrect_value_penalty: 0.5  # Revenue reduction for submitting tasks with incorrect information values (0.5 = 50% penalty)
  
communication:
  # Action limit per turn (set to -1 for unlimited)
  # This limits the total number of actions an agent can take in their turn
  max_actions_per_turn: -1
  
logging:
  # What to log
  log_all_messages: true
  log_agent_reasoning: true  # Perfect agents will log their deterministic reasoning
  log_task_attempts: true
