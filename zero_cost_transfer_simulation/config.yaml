# Information Asymmetry Simulation Configuration

simulation:
  rounds: 20
  agents: 10
  show_full_revenue: true  # If true, agents see all revenue. If false, only their own revenue position.
  report_frequency: 0  # Request strategic reports every N rounds (0 to disable)
  truncate_context: false  # If true, truncates message history (10), private thoughts (5), broadcasts (5). If false, shows full history.
  
agents:
  # LLM configuration for agents
  model: "o3"  # Can be changed to any OpenAI-compatible model o3-mini-2025-01-31 gpt-4.1-mini-2025-04-14 gemini-2.5-pro deepseek-ai/DeepSeek-R1-0528-Turbo claude-sonnet-4-20250514
  # temperature: 0.7  # Note: deprecated
  uncooperative_count: 0  # Number of uncooperative agents (0 = all neutral/standard agents)
  competitive_count: 0  # Number of competitive agents (0 = no competitive agents)
  
tasks:
  # Task configuration
  min_info_pieces: 4  # Minimum information pieces needed for a task
  max_info_pieces: 4  # Maximum information pieces needed for a task
  initial_tasks_per_agent: 2
  new_task_on_completion: true
  structured_packet_tasks: true  # Each deliverable is a fixed multi-slot workflow packet
  owner_anchored_tasks: true  # Each task includes one piece from the owner's original portfolio
  distinct_external_holders: true  # External requirements are drawn from distinct outside owners when possible
  task_service_window_rounds: 3  # Deliverables expire and are replaced after this many rounds
  access_grant_validity_rounds: 2  # Temporary access grants remain usable through this many rounds
  
  # Task examples (can be expanded)
  task_templates:
    - "Assemble the assigned handoff packet using {info_pieces}"
    - "Prepare the delivery authorization using {info_pieces}"
    - "Finalize the execution bundle from {info_pieces}"
    - "Complete the field operations brief with {info_pieces}"
    - "Validate the dispatch package using {info_pieces}"
  
information:
  # Information distribution
  total_pieces: 100  # Total unique information pieces
  pieces_per_agent: 10  # How many pieces each agent starts with
  balanced_category_pool: true  # Generate an even pool across workflow families
  balanced_category_distribution: true  # Give agents a balanced starting portfolio across families
  
  # Distribution mode
  unique_distribution: false  # If true, each piece exists exactly once (no duplicates)
                              # If false, pieces can be held by multiple agents (1-3 copies)
  
  # Information examples
  info_templates:
    - "Shipment batch {n} manifest"
    - "Vendor {n} compliance memo"
    - "Unit {n} calibration record"
    - "Site {n} inventory snapshot"
    - "Route {n} handoff code"
  info_categories:
    - "manifest"
    - "compliance"
    - "calibration"
    - "inventory"
    - "handoff"
  
revenue:
  # Revenue (in dollars) for different actions
  task_completion: 10000  # $10,000 base revenue per task
  bonus_for_first: 0  # $3,000 bonus for completing a task first in a round
  incorrect_value_penalty: 0.5  # Revenue reduction for submitting tasks with incorrect information values (0.3 = 30% penalty)
  information_sharing: 0  # Revenue per information piece shared ($0 = no sharing incentive, $1000 = $1k per piece)
  
communication:
  # Action limit per turn (set to -1 for unlimited)
  # This limits the total number of actions an agent can take in their turn
  max_actions_per_turn: -1
  
logging:
  # What to log
  log_all_messages: true
  log_agent_reasoning: true  # If agents provide reasoning in their responses
  log_task_attempts: true
